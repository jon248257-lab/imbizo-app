name: Build APK
on: 
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build with Buildozer
      uses: nngerncham/buildozer-action@v1.2.1
      with:
        buildozer_command: android debug
        repo_path: .
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: imbizo-apk
        path: bin/*.apk
